name: Classic Mode

# Installs TYPO3 without Composer (classic mode) with the crawler extension as packaged for the TER,
# and checks that it works, see Build/Scripts/classicModeTest.sh.
# The second job runs the acceptance tests (Tests/Acceptance) against a classic mode installation with the
# content of the devbox. The nightly run catches new TYPO3 releases breaking the extension in classic mode.

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

jobs:
  ClassicMode:
    name: Classic mode (TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        typo3:
          - "14"
        php:
          - "8.2"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite, gd, zip, mbstring, xml
          coverage: none

      - name: Install TYPO3 in classic mode and crawl
        run: Build/Scripts/classicModeTest.sh "${{ matrix.typo3 }}" "${{ runner.temp }}/typo3-classic"

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: classic-mode-logs-${{ matrix.typo3 }}-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/typo3-classic/php-server.log
            ${{ runner.temp }}/typo3-classic/public/typo3temp/var/log/
          retention-days: 10

  ClassicModeAcceptance:
    name: Classic mode acceptance tests (TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        typo3:
          - "14"
        php:
          - "8.2"
          - "8.5"

    services:
      # The database of the devbox, see .devbox/.ddev/config.yaml
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mysqli, pdo_mysql, gd, zip, mbstring, xml
          coverage: none

      - name: Install TYPO3 in classic mode with the devbox
        run: Build/Scripts/classicModeTest.sh "${{ matrix.typo3 }}" "${{ runner.temp }}/typo3-classic" devbox

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: cd Tests/Acceptance && npm ci

      - name: Install Playwright Browsers
        run: cd Tests/Acceptance && npx playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:8080/
          ACCEPTANCE_TYPO3_COMMAND: php ${{ runner.temp }}/typo3-classic/public/typo3/sysext/core/bin/typo3
          ACCEPTANCE_SQL_COMMAND: php ${{ github.workspace }}/Build/Scripts/classicModeSql.php ${{ runner.temp }}/typo3-classic/public
        run: cd Tests/Acceptance && npx playwright test --grep @v14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: classic-mode-playwright-report-${{ matrix.typo3 }}-${{ matrix.php }}
          path: Tests/Acceptance/playwright-report/
          retention-days: 10

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: classic-mode-acceptance-logs-${{ matrix.typo3 }}-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/typo3-classic/php-server.log
            ${{ runner.temp }}/typo3-classic/public/typo3temp/var/log/
          retention-days: 10
