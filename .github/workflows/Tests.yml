name: Tests

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"

jobs:
  Unit:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        typo3:
          - '^14.3'
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        mysql:
          - '8.0'

    steps:
      - name: Set up MySQL ${{ matrix.mysql }}
        # Pulled from the Amazon ECR Public mirror of the Docker official images, as Docker Hub rate-limits anonymous pulls
        run: |
          docker run --name db -d -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root \
            public.ecr.aws/docker/library/mysql:${{ matrix.mysql }} \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
          # Waits for the server, over TCP, as the port is open before the database is ready
          for i in $(seq 1 120); do
            docker exec db sh -c 'mariadb-admin ping -h127.0.0.1 -uroot -proot --silent || mysqladmin ping -h127.0.0.1 -uroot -proot --silent' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MySQL did not start" && docker logs db && exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Environment Check
        run: |
          php --version
          composer --version

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress
          git checkout composer.json
          ln -nfs .Build/vendor/typo3/cms/typo3 typo3

      - name: Lint PHP
        run: find . -name \*.php ! -path "./.Build/*" ! -path "./scripts/*" ! -path "./typo3_src/*" ! -path "./Resources/*" | parallel --gnu php -d display_errors=stderr -l {} > /dev/null \;

      - name: Unit Tests
        run: |
          export "UNIT_XML"=Tests/UnitTests.xml
          .Build/bin/phpunit --colors -c $UNIT_XML Tests/Unit

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root
