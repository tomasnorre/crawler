name: Test Coveralls

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"


jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Set up MySQL 8.0
        # Pulled from the Amazon ECR Public mirror of the Docker official images, as Docker Hub rate-limits anonymous pulls
        run: |
          docker run --name db -d -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root \
            public.ecr.aws/docker/library/mysql:8.0 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
          # Waits for the server, over TCP, as the port is open before the database is ready
          for i in $(seq 1 120); do
            docker exec db sh -c 'mariadb-admin ping -h127.0.0.1 -uroot -proot --silent || mysqladmin ping -h127.0.0.1 -uroot -proot --silent' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MySQL did not start" && docker logs db && exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit of a pull request and its first parent (the base branch) for the patch coverage
          fetch-depth: 2

      - name: Set up PHP Version 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Unit Tests
        run: |
          mkdir -p .Logs/coverage
          export "UNIT_XML"=Tests/UnitTests.xml
          XDEBUG_MODE=coverage .Build/bin/phpunit --coverage-filter Classes --coverage-clover=unittest-coverage.clover --coverage-php=.Logs/coverage/unit.cov --colors -c $UNIT_XML Tests/Unit

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          XDEBUG_MODE=coverage .Build/bin/phpunit --coverage-filter Classes --coverage-clover=functional-coverage.clover --coverage-php=.Logs/coverage/functional.cov --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root

      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          composer global require php-coveralls/php-coveralls --no-progress --no-suggest --no-interaction
          /home/runner/.composer/vendor/bin/php-coveralls -c .coveralls.yml -vvv --json_path=Tests/coveralls-upload.json
        #continue-on-error: true

      - name: Patch coverage
        if: github.event_name == 'pull_request'
        run: |
          .Build/bin/phpcov merge --php .Logs/coverage.cov .Logs/coverage
          Build/Scripts/patchCoverage.sh HEAD^1
