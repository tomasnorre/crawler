name: DBMS Compat Checks

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"

jobs:
  PostgreSQL:
    name: PostgreSQL
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '10'
          - '11'
          - '12'
          - '13'
          - '14'
          - '15'
          - '16'
          - '17'
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Set up PostgreSQL ${{ matrix.postgres }}
        # Pulled from the Amazon ECR Public mirror of the Docker official images, as Docker Hub rate-limits anonymous pulls
        run: |
          docker run -e POSTGRES_DB=root -e POSTGRES_USER=root -e POSTGRES_PASSWORD=root -d -p 5432:5432 \
            public.ecr.aws/docker/library/postgres:${{ matrix.postgres }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress
          git checkout composer.json
          ln -nfs .Build/vendor/typo3/cms/typo3 typo3

      - name: Wait for PostgreSQL
        run: |
          while ! nc -z localhost 5432; do
            sleep 1;
          done;
          echo Database is up;

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          rm -rf .Build/Web/typo3temp/
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseDriver: pdo_pgsql
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root

  SQLite:
    name: SQLite
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
        typo3:
          - '^14.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress

      - name: Functional Tests
        run: composer test:functional-sqlite

  MariaDB:
    name: MariaDB
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mariadb:
          - '10.3'
          - '10.4'
          - '10.5'
          - '10.6'
          - '10.7'
          - '10.8'
          - '10.9'
          - '10.10'
          - '10.11'
          - '11.1'
          - '11.2'
          - '11.3'
          - '11.4'
          - '11.5'
          - '11.6'
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Set up MariaDB ${{ matrix.mariadb }}
        # Pulled from the Amazon ECR Public mirror of the Docker official images, as Docker Hub rate-limits anonymous pulls
        run: |
          docker run --name db -d -p 3306:3306 -e MARIADB_ROOT_PASSWORD=root \
            public.ecr.aws/docker/library/mariadb:${{ matrix.mariadb }} \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
          # Waits for the server, over TCP, as the port is open before the database is ready
          for i in $(seq 1 120); do
            docker exec db sh -c 'mariadb-admin ping -h127.0.0.1 -uroot -proot --silent || mysqladmin ping -h127.0.0.1 -uroot -proot --silent' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MariaDB did not start" && docker logs db && exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress
          git checkout composer.json
          ln -nfs .Build/vendor/typo3/cms/typo3 typo3

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root

  MySQL:
    name: MySQL
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mysql:
          - '8.0'
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Set up MySQL ${{ matrix.mysql }}
        # Pulled from the Amazon ECR Public mirror of the Docker official images, as Docker Hub rate-limits anonymous pulls
        run: |
          docker run --name db -d -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root \
            public.ecr.aws/docker/library/mysql:${{ matrix.mysql }} \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
          # Waits for the server, over TCP, as the port is open before the database is ready
          for i in $(seq 1 120); do
            docker exec db sh -c 'mariadb-admin ping -h127.0.0.1 -uroot -proot --silent || mysqladmin ping -h127.0.0.1 -uroot -proot --silent' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MySQL did not start" && docker logs db && exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress
          git checkout composer.json
          ln -nfs .Build/vendor/typo3/cms/typo3 typo3

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root
