name: DBMS Compat Checks

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"

jobs:
  # A job tests several versions, as its setup takes about as long as the tests of one version
  DBMS:
    name: ${{ matrix.database.name }} (${{ matrix.database.versions }}, ${{ matrix.typo3 }}, ${{ matrix.php }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        database:
          - { name: 'PostgreSQL', dbms: 'postgres', versions: '10 11 12 13' }
          - { name: 'PostgreSQL', dbms: 'postgres', versions: '14 15 16 17' }
          - { name: 'MariaDB', dbms: 'mariadb', versions: '10.4 10.5 10.6 10.7 10.8' }
          - { name: 'MariaDB', dbms: 'mariadb', versions: '10.9 10.10 10.11 11.1 11.2' }
          - { name: 'MariaDB', dbms: 'mariadb', versions: '11.3 11.4 11.5 11.6' }
          - { name: 'MySQL', dbms: 'mysql', versions: '8.0' }
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress

      - name: Functional Tests
        run: |
          failed=""
          for version in ${{ matrix.database.versions }}; do
            echo "::group::${{ matrix.database.name }} $version"
            Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -d ${{ matrix.database.dbms }} -i "$version" -s functional || failed="$failed $version"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Functional tests failed on ${{ matrix.database.name }}$failed"
            exit 1
          fi

  SQLite:
    name: SQLite
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
        typo3:
          - '^14.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --no-progress

      - name: Functional Tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -d sqlite -s functional
