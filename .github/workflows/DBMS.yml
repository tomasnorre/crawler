name: DBMS Compat Checks

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "Documentation/**"
      - "**.md"
  push:
    branches:
      - "main"
    paths-ignore:
      - "Documentation/**"
      - "**.md"

jobs:
  PostgreSQL:
    name: PostgreSQL
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '10'   # EOL Nov 2022 (unsupported)
          - '11'   # EOL Nov 2023 (unsupported)
          - '12'   # EOL Nov 2024 (unsupported)
          - '13'   # EOL Nov 2025 (unsupported)
          - '14'   # EOL Nov 2026 (unsupported)
          - '15'   # EOL Nov 2027
          - '16'   # EOL Nov 2028
          - '17'   # EOL Nov 2029
          - '18'   # EOL Nov 2030
          - '19'   # EOL Nov 2031
        typo3:
          - '14'
        php:
          - '8.2'
        composerInstall: [ 'composerInstallLowest', 'composerInstallHighest' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install testing system
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }}  -s ${{ matrix.composerInstall }}

      - name: Functional Tests with postgres
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -d postgres -i ${{ matrix.postgres }} -s functional

  SQLite:
    name: SQLite
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
        typo3:
          - '14'
        composerInstall: [ 'composerInstallLowest', 'composerInstallHighest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install testing system
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }}  -s ${{ matrix.composerInstall }}

      - name: Functional Tests with postgres
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -d sqlite -s functional

  MariaDB:
    name: MariaDB
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mariadb:
          - '10.11'   # LTS, community EOL Feb 2028
          - '11.4'    # LTS, EOL May 2029
          - '11.8'    # LTS, EOL Jun 2028
          - '12.3'    # LTS, EOL Jun 2029
          - '13.1'    # newest rolling; replace with 13.3 when it ships (mid-2027)
        typo3:
          - '14'
        php:
          - '8.2'
        composerInstall: [ 'composerInstallLowest', 'composerInstallHighest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install testing system
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }}  -s ${{ matrix.composerInstall }}

      - name: Functional Tests with postgres
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -d mariadb -a mysqli -i ${{ matrix.mariadb }} -s functional

  MySQL:
    name: MySQL
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mysql:
          - '8.0'   # EOL Apr 2026 (unsupported)
          - '8.4'   # LTS, premier support to Apr 2029, EOL Apr 2032
          - '9.7'   # LTS, premier support to Apr 2031, EOL Apr 2034
        typo3:
          - '14'
        php:
          - '8.2'
        composerInstall: [ 'composerInstallLowest', 'composerInstallHighest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install testing system
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }}  -s ${{ matrix.composerInstall }}

      - name: Functional Tests with postgres
        run: Build/Scripts/runTests.sh -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -d mysql -a mysqli -i ${{ matrix.mysql }} -s functional
