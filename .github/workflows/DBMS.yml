name: DBMS Compat Checks

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "Documentation/**"
      - "**.md"
  push:
    branches:
      - "main"
    paths-ignore:
      - "Documentation/**"
      - "**.md"

jobs:
  PostgreSQL:
    name: PostgreSQL
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '10'   # EOL Nov 2022 (unsupported)
          - '11'   # EOL Nov 2023 (unsupported)
          - '12'   # EOL Nov 2024 (unsupported)
          - '13'   # EOL Nov 2025 (unsupported)
          - '14'   # EOL Nov 2026 (unsupported)
          - '15'   # EOL Nov 2027
          - '16'   # EOL Nov 2028
          - '17'   # EOL Nov 2029
          - '18'   # EOL Nov 2030
          - '19'   # EOL Nov 2031
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Set up PostgreSQL ${{ matrix.postgres }}
        run: |
          docker run -e POSTGRES_DB=root -e POSTGRES_USER=root -e POSTGRES_PASSWORD=root -d -p 5432:5432 postgres:${{ matrix.postgres }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Require typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Wait for PostgreSQL
        run: |
          while ! nc -z localhost 5432; do
            sleep 1;
          done;
          echo Database is up;

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          rm -rf .Build/Web/typo3temp/
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseDriver: pdo_pgsql
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root

  SQLite:
    name: SQLite
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
        typo3:
          - '^14.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Require typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Functional Tests
        run: composer test:functional-sqlite

  MariaDB:
    name: MariaDB
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mariadb:
          - '10.11'   # LTS, community EOL Feb 2028
          - '11.4'    # LTS, EOL May 2029
          - '11.8'    # LTS, EOL Jun 2028
          - '12.3'    # LTS, EOL Jun 2029
          - '13.0'    # newest rolling; replace with 13.3 when it ships (mid-2027)
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Set up MariaDB ${{ matrix.mariadb }}
        uses: getong/mariadb-action@v1.11
        with:
          mariadb version: ${{ matrix.mariadb }}
          mysql root password: 'root'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Require typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root

  MySQL:
    name: MySQL
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mysql:
          - '8.0'   # EOL Apr 2026 (unsupported)
          - '8.4'   # LTS, premier support to Apr 2029, EOL Apr 2032
          - '9.7'   # LTS, premier support to Apr 2031, EOL Apr 2034
        typo3:
          - '^14.3'
        php:
          - '8.2'
    steps:
      - name: Set up MySQL ${{ matrix.mysql }}
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql version: ${{ matrix.mysql }}
          mysql root password: 'root'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Require typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/FunctionalTests.xml
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional --process-isolation
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root
