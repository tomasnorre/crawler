name: Static Analysis

on:
    pull_request:
        branches:
            - "**"
    push:
        branches:
            - "main"

jobs:
    phpstan:
        name: PHPstan
        runs-on: ubuntu-26.04
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none
            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
            -   run: composer analyse

    rector:
        name: Rector
        runs-on: ubuntu-26.04
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none
            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
            -   run: composer rector

    code-style:
        name: Code Style
        runs-on: ubuntu-26.04
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none
            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
            -   run: composer cs-fix

    Psalm:
        name: Psalm
        runs-on: ubuntu-26.04
        steps:
            -   uses: actions/checkout@v7
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none
            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
            -   run: .Build/bin/psalm --no-cache --shepherd

