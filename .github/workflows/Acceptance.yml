name: Acceptance Tests

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
  schedule:
    - cron: "7 2 * * *"

jobs:
  Acceptance:
    strategy:
      fail-fast: false
      matrix:
        typo3:
          - ^14.3
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        # Evaluates Lightpanda (https://lightpanda.io/) as a faster browser for the acceptance tests, see #1319
        browser:
          - chromium
          - lightpanda

    name: Acceptance (${{ matrix.typo3 }}, ${{ matrix.php }}, ${{ matrix.browser }})
    # Lightpanda is evaluated only, its failures don't fail the build
    continue-on-error: ${{ matrix.browser == 'lightpanda' }}
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - name: Set Playwright tag
        shell: bash
        run: echo "PW_GREP=@v14" >> $GITHUB_ENV

      - uses: actions/checkout@v7
      - name: Prepare devbox before start
        run: |
          export FROM_PATH='../../'
          export TO_PATH=$(echo $GITHUB_WORKSPACE)
          cd .devbox
          sed -i 's/php_version: "8.2"/php_version: "${{ matrix.php }}"/g' .ddev/config.yaml
          sed -i "s|$FROM_PATH|$TO_PATH|g" .ddev/docker-compose.volume.yaml
          jq '.require["typo3/cms-core"] = "${{ matrix.typo3 }}"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

      # Starts the devbox; "ddev start" returns once the post-start hooks have run
      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          ddevDir: ".devbox"
          version: "1.25.5"

      - name: Check that the devbox responds
        run: curl --fail --silent --show-error --insecure --output /dev/null --retry 10 --retry-delay 3 --retry-all-errors https://crawler-devbox.ddev.site/

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: cd Tests/Acceptance && npm ci
      - name: Install Playwright Browsers
        if: ${{ matrix.browser == 'chromium' }}
        run: cd Tests/Acceptance && npx playwright install chromium --with-deps
      - name: Start Lightpanda
        if: ${{ matrix.browser == 'lightpanda' }}
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/lightpanda" \
            "https://github.com/lightpanda-io/browser/releases/download/${LIGHTPANDA_VERSION}/lightpanda-x86_64-linux"
          chmod +x "$RUNNER_TEMP/lightpanda"
          # The devbox uses a certificate of the DDEV CA, which Lightpanda doesn't know
          nohup "$RUNNER_TEMP/lightpanda" serve --host 127.0.0.1 --port 9222 --insecure-disable-tls-host-verification \
            > "$RUNNER_TEMP/lightpanda.log" 2>&1 &
          curl --silent --output /dev/null --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:9222/json/version
          echo "PLAYWRIGHT_CDP_ENDPOINT=ws://127.0.0.1:9222" >> $GITHUB_ENV
        env:
          LIGHTPANDA_VERSION: "1.0.4"
      - name: Run Playwright tests
        run: cd Tests/Acceptance && npx playwright test --grep "$PW_GREP"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.typo3 }}-${{ matrix.php }}-${{ matrix.browser }}
          path: Tests/Acceptance/playwright-report/
          retention-days: 10

      - name: Collect DDEV logs
        if: ${{ failure() }}
        working-directory: .devbox
        run: |
          mkdir -p ../ddev-logs
          ddev describe > ../ddev-logs/describe.txt 2>&1 || true
          ddev logs --service web > ../ddev-logs/web.log 2>&1 || true
          ddev logs --service db > ../ddev-logs/db.log 2>&1 || true
          docker ps --all > ../ddev-logs/docker-ps.txt 2>&1 || true
          cp "$RUNNER_TEMP/lightpanda.log" ../ddev-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ddev-logs-${{ matrix.typo3 }}-${{ matrix.php }}-${{ matrix.browser }}
          path: ddev-logs/
          retention-days: 10
