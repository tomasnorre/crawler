name: Acceptance Tests

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
  schedule:
    - cron: "7 2 * * *"

jobs:
  Acceptance:
    strategy:
      fail-fast: false
      matrix:
        typo3:
          - ^13.4
          - ^14.3
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    timeout-minutes: 60
    runs-on: 'self-hosted'
    steps:
      - name: Get branch name (merge)
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_ENV

      - name: Get branch name (pull request)
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF})" >> $GITHUB_ENV

      - name: Set Playwright tag
        shell: bash
        run: |
          if [[ "${{ matrix.typo3 }}" == "^13.4" ]]; then
            echo "PW_GREP=@v13" >> $GITHUB_ENV
          elif [[ "${{ matrix.typo3 }}" == "^14.3" ]]; then
            echo "PW_GREP=@v14" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Caching layers to speed up dependency installation
      # ---------------------------------------------------------
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: .devbox/vendor
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('.devbox/composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.typo3 }}-
            composer-${{ matrix.php }}-

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: Tests/Acceptance/package-lock.json

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('Tests/Acceptance/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Patch composer.json for forked PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cd .devbox
          composer config repositories.crawler-pr '{"type": "vcs", "url": "https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git"}'

      - name: Prepare devbox before start
        run: |
          export FROM_PATH='../../'
          export TO_PATH=$(echo $GITHUB_WORKSPACE)
          cd .devbox
          sed -i 's/php_version: "8.2"/php_version: "${{ matrix.php }}"/g' .ddev/config.yaml
          sed -i "s|$FROM_PATH|$TO_PATH|g" .ddev/docker-compose.volume.yaml

      - uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: ".devbox"

      - name: Playwright Environment Setup & Services
        run: |
          cd .devbox
          # Only clean composer lock/vendor if cache wasn't hit or if forced,
          # but keeping it safe with conditional check or standard run:
          ddev composer require typo3/cms-core=${{ matrix.typo3 }} tomasnorre/crawler=dev-$BRANCH_NAME --prefer-dist
          cd ..

          # Use curl or check directly instead of downloading wait-for-it every time if possible,
          # or keep it lightweight:
          if [ ! -f "wait-for-it.sh" ]; then
            wget -q https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh
            chmod +x wait-for-it.sh
          fi
          ./wait-for-it.sh -t 60 127.0.0.1:80
          ./wait-for-it.sh -t 60 127.0.0.1:443

      - name: Install Node dependencies
        run: cd Tests/Acceptance && npm ci

      - name: Install Playwright Browsers (Skipped if cached)
        run: cd Tests/Acceptance && npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: cd Tests/Acceptance && npx playwright test --grep "$PW_GREP"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.typo3 }}-${{ matrix.php }}
          path: Tests/Acceptance/playwright-report/
          retention-days: 10
