name: Acceptance Tests

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
  schedule:
    - cron: "7 2 * * *"

jobs:
  Acceptance:
    strategy:
      fail-fast: false
      matrix:
        typo3:
          - ^14.3
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"

    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - name: Set Playwright tag
        shell: bash
        run: echo "PW_GREP=@v14" >> $GITHUB_ENV

      - uses: actions/checkout@v7
      - name: Prepare devbox before start
        run: |
          export FROM_PATH='../../'
          export TO_PATH=$(echo $GITHUB_WORKSPACE)
          cd .devbox
          sed -i "s|$FROM_PATH|$TO_PATH|g" .ddev/docker-compose.volume.yaml
          jq '.require["typo3/cms-core"] = "${{ matrix.typo3 }}"' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

      - name: Set the PHP version
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          echo "php_version: \"${PHP_VERSION}\"" > .ddev/config.ci.yaml

      # Starts the devbox; "ddev start" returns once the post-start hooks have run
      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          ddevDir: ".devbox"
          version: "1.25.6"

      - name: Check that the devbox responds
        run: curl --fail --silent --show-error --insecure --output /dev/null --retry 10 --retry-delay 3 --retry-all-errors https://crawler-devbox.ddev.site/

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: cd Tests/Acceptance && npm ci
      - name: Install Playwright Browsers
        run: cd Tests/Acceptance && npx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: cd Tests/Acceptance && npx playwright test --grep "$PW_GREP"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.typo3 }}-${{ matrix.php }}
          path: Tests/Acceptance/playwright-report/
          retention-days: 10

      - name: Collect DDEV logs
        if: ${{ failure() }}
        working-directory: .devbox
        run: |
          mkdir -p ../ddev-logs
          ddev describe > ../ddev-logs/describe.txt 2>&1 || true
          ddev logs --service web > ../ddev-logs/web.log 2>&1 || true
          ddev logs --service db > ../ddev-logs/db.log 2>&1 || true
          docker ps --all > ../ddev-logs/docker-ps.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ddev-logs-${{ matrix.typo3 }}-${{ matrix.php }}
          path: ddev-logs/
          retention-days: 10
